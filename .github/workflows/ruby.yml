name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ruby-head is allowed to fail: continue-on-error makes a failed entry report "success" to ci-gate.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        include:
          - ruby-version: ruby-head
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Gemfile.lock is pinned to Bundler 2.4.22 (the last Bundler that runs on Ruby 2.6) and to old gem versions
      # (rake 13.0.6 needs ostruct, which Ruby 4.0 no longer ships). On Ruby 4.0+ Bundler 4 would switch to the
      # locked 2.4.22 and fail, so those jobs drop the lockfile and resolve fresh with the bundled Bundler.
      - name: Ignore Gemfile.lock on Ruby 4.0+
        if: matrix.ruby-version == '4.0' || matrix.ruby-version == 'ruby-head'
        run: rm Gemfile.lock
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: bundle exec rake

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # rubocop lives in its own Gemfile: it needs Ruby >= 2.7, the test matrix starts at 2.6.
      BUNDLE_GEMFILE: gemfiles/rubocop.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rubocop

  ci-gate:
    if: always()
    needs: [test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            [ "${result}" = "success" ] || exit 1
          done
